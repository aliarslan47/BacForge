[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bacforge"
version = "0.1.0"
description = "BacForge — prokaryotik bakteriyel WGS analiz platformu"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6"]

[project.scripts]
bacforge = "bacforge.cli:main"

[tool.setuptools.packages.find]
include = ["bacforge*"]
