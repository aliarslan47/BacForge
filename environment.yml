# =====================================================================
# Ali WGS Pipeline — ÇEKİRDEK ortam (orchestrator + evrensel hafif araçlar)
# KURAL: Ağır/çakışan araçlar (medaka, checkm2, bakta, flye...) BURADA DEĞİL;
#        her biri izole env'de (bkz. docs/04_ENV_DB.md + envs/*.yml) → conda run.
# Kurulum: conda env create -f environment.yml   (sonra: setup_envs.sh izole env'ler)
# =====================================================================
name: ali-wgs
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  # --- orchestrator (Python çekirdek) ---
  - python=3.11
  - pyyaml=6.*
  - pandas=2.*
  - jinja2=3.*          # HTML rapor
  - weasyprint=62.*     # HTML -> PDF
  - psutil=5.*          # kaynak tespiti (fallback stdlib var)
  # --- evrensel hafif araçlar (her platformda kullanılır) ---
  - seqkit=2.*          # FASTA/FASTQ istatistik (01,03,07)
  - minimap2=2.*        # coverage/mapping (06)
  - samtools=1.*        # BAM işleme, fastq dönüşüm (02,06)
  - bwa-mem2=2.*        # kısa okuma mapping (06, hybrid)
  - pip
